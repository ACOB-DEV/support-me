name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  env-example-drift:
    name: Check .env.example drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare shared contract IDs across frontend/.env.example and backend/.env.example
        run: node scripts/check-env-example-drift.js

  contracts:
    name: Contracts (Rust/Soroban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --workspace

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build contracts to WASM
        run: cargo build --workspace --target wasm32v1-none --release

  backend:
    name: Backend (Node/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supportme?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Prisma client + TypeScript)
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check migrations match schema.prisma (drift)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE prisma_shadow;'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/prisma_shadow?schema=public" \
            --exit-code

      - name: Seed demo data twice (idempotency smoke, #280)
        run: |
          npx prisma db seed
          npx prisma db seed
        env:
          NODE_ENV: test

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Diffs the base and head refs' dependency manifests, so it only has
    # something to compare on a pull request (a push to main has no "before"
    # side to diff in that sense here).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Flags a pull request that newly introduces a high-severity (or
      # above) vulnerable dependency, without failing on vulnerabilities
      # that already exist on main: unlike a flat `npm audit
      # --audit-level=high` step, which would fail on every PR today given
      # this repo's existing dependency tree (see TESTING.md).
      - name: Scan dependency changes for new vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  type-drift:
    name: Check Type Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if frontend types updated when contracts/common changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF=${{ github.event.pull_request.base.sha }}
            COMMON_CHANGED=$(git diff --name-only $BASE_REF | grep -E "^contracts/common/src/lib\.rs" || true)
            if [ -n "$COMMON_CHANGED" ]; then
              TS_CHANGED=$(git diff --name-only $BASE_REF | grep -E "^frontend/.*\.tsx?$" || true)
              if [ -z "$TS_CHANGED" ]; then
                echo "Error: contracts/common/src/lib.rs changed, but no frontend TypeScript files were updated."
                echo "Please ensure any changes to shared types are mirrored in the frontend."
                exit 1
              else
                echo "contracts/common changed, and frontend TS files changed. Assuming types are synced."
              fi
            fi
          fi

  test-all:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [contracts, backend, frontend, e2e, dependency-review, type-drift]
    # dependency-review only runs on pull_request (see its own `if:` above),
    # so on a push to main it reports "skipped" rather than succeeding; allow
    # that specific outcome through rather than blocking test-all on it.
    if: always()
    needs: [env-example-drift, contracts, backend, frontend, e2e, type-drift]
    steps:
      - name: Fail if any required job did not succeed or get skipped
        run: |
          echo "${{ toJSON(needs) }}"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
      - run: echo "All test suites and checks passed."
